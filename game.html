<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNES JRPG Framework - Complete Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: white;
    }
    
    #game-container {
      text-align: center;
      border: 3px solid #4a4a6a;
      border-radius: 10px;
      padding: 20px;
      background: linear-gradient(45deg, #2a2a4a, #1a1a3a);
    }
    
    #game-canvas {
      border: 2px solid #6a6a8a;
      background: #000;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      box-shadow: 0 0 20px rgba(100, 100, 200, 0.3);
    }
    
    #ui {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }
    
    #controls {
      margin-top: 10px;
      padding: 10px;
      background: rgba(50, 50, 80, 0.5);
      border-radius: 5px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>🎮 SNES JRPG Framework</h1>
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="ui">
      <div id="status">Loading...</div>
      <div id="debug-info"></div>
    </div>
    <div id="controls">
      <strong>Controls:</strong> WASD/Arrows: Move Player | E: Interact with NPC | I: Toggle Inventory | Space: Action
    </div>
  </div>

  <script>
    console.log('🎮 Complete SNES JRPG Framework starting...');

    class SNESJRPGGame {
      constructor() {
        // Core game state
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.running = false;
        this.frame = 0;
        
        // Game world
        this.player = { x: 10, y: 10, facing: 'down' };
        this.npc = { x: 15, y: 8 };
        this.gridSize = 32;
        this.showInventory = false;
        
        // Input handling
        this.keys = new Set();
        this.setupInput();
        
        // Game data
        this.inventory = [
          { name: 'Health Potion', quantity: 3, type: 'consumable' },
          { name: 'Iron Sword', quantity: 1, type: 'weapon' },
          { name: 'Ancient Key', quantity: 1, type: 'key' }
        ];
        
        this.initialize();
      }

      initialize() {
        console.log('🚀 Initializing JRPG game...');
        document.getElementById('status').textContent = 'Game Ready!';
        
        // Test render
        this.render();
        
        // Start game loop
        this.start();
        
        console.log('✅ Game initialized successfully');
      }

      setupInput() {
        document.addEventListener('keydown', (e) => {
          this.keys.add(e.code);
          
          // Handle special keys
          if (e.code === 'KeyI') {
            this.showInventory = !this.showInventory;
          }
          
          if (e.code === 'KeyE') {
            this.checkNPCInteraction();
          }
          
          e.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
          this.keys.delete(e.code);
        });
      }

      checkNPCInteraction() {
        const distance = Math.abs(this.player.x - this.npc.x) + Math.abs(this.player.y - this.npc.y);
        if (distance <= 2) {
          alert('🤖 Alien NPC: "Greetings, human! Welcome to our JRPG framework demo!"');
        }
      }

      update() {
        // Handle movement
        let moved = false;
        const newPos = { ...this.player };
        
        if (this.keys.has('KeyW') || this.keys.has('ArrowUp')) {
          newPos.y -= 1;
          this.player.facing = 'up';
          moved = true;
        }
        if (this.keys.has('KeyS') || this.keys.has('ArrowDown')) {
          newPos.y += 1;
          this.player.facing = 'down';
          moved = true;
        }
        if (this.keys.has('KeyA') || this.keys.has('ArrowLeft')) {
          newPos.x -= 1;
          this.player.facing = 'left';
          moved = true;
        }
        if (this.keys.has('KeyD') || this.keys.has('ArrowRight')) {
          newPos.x += 1;
          this.player.facing = 'right';
          moved = true;
        }

        // Apply movement (with bounds checking)
        if (moved && this.frame % 10 === 0) { // Limit movement speed
          if (newPos.x >= 0 && newPos.x < 25 && newPos.y >= 0 && newPos.y < 19) {
            this.player = newPos;
          }
        }
      }

      render() {
        const time = Date.now() / 1000;
        
        // Clear with SNES-style background
        const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
        gradient.addColorStop(0, '#1a1a3a');
        gradient.addColorStop(1, '#0a0a2a');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw grid pattern (world tiles)
        this.ctx.strokeStyle = 'rgba(100, 100, 200, 0.15)';
        this.ctx.lineWidth = 1;
        
        for (let x = 0; x < this.canvas.width; x += this.gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(x, 0);
          this.ctx.lineTo(x, this.canvas.height);
          this.ctx.stroke();
        }
        
        for (let y = 0; y < this.canvas.height; y += this.gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(this.canvas.width, y);
          this.ctx.stroke();
        }

        // Draw environment tiles
        for (let x = 5; x < 20; x++) {
          for (let y = 5; y < 15; y++) {
            const isWall = (x === 5 || x === 19 || y === 5 || y === 14);
            if (isWall) {
              this.ctx.fillStyle = '#4a4a6a';
              this.ctx.fillRect(x * this.gridSize, y * this.gridSize, this.gridSize, this.gridSize);
            } else {
              const shade = ((x + y) % 2) * 10;
              this.ctx.fillStyle = `rgb(${20 + shade}, ${40 + shade}, ${20 + shade})`;
              this.ctx.fillRect(x * this.gridSize + 2, y * this.gridSize + 2, this.gridSize - 4, this.gridSize - 4);
            }
          }
        }

        // Draw NPC (green alien)
        const npcX = this.npc.x * this.gridSize + this.gridSize/2;
        const npcY = this.npc.y * this.gridSize + this.gridSize/2;
        const npcBob = Math.sin(time * 3) * 3;
        
        this.ctx.fillStyle = '#00ff88';
        this.ctx.beginPath();
        this.ctx.arc(npcX, npcY + npcBob, 12, 0, Math.PI * 2);
        this.ctx.fill();
        
        // NPC eyes
        this.ctx.fillStyle = '#000';
        this.ctx.beginPath();
        this.ctx.arc(npcX - 4, npcY + npcBob - 3, 2, 0, Math.PI * 2);
        this.ctx.arc(npcX + 4, npcY + npcBob - 3, 2, 0, Math.PI * 2);
        this.ctx.fill();

        // Draw player (blue hero)
        const playerX = this.player.x * this.gridSize + this.gridSize/2;
        const playerY = this.player.y * this.gridSize + this.gridSize/2;
        
        this.ctx.fillStyle = '#4499ff';
        this.ctx.beginPath();
        this.ctx.arc(playerX, playerY, 10, 0, Math.PI * 2);
        this.ctx.fill();
        
        // Player direction indicator
        this.ctx.fillStyle = '#ffffff';
        let dirX = 0, dirY = 0;
        switch(this.player.facing) {
          case 'up': dirY = -6; break;
          case 'down': dirY = 6; break;
          case 'left': dirX = -6; break;
          case 'right': dirX = 6; break;
        }
        this.ctx.beginPath();
        this.ctx.arc(playerX + dirX, playerY + dirY, 2, 0, Math.PI * 2);
        this.ctx.fill();

        // Draw UI
        this.drawUI();
        
        // Draw inventory if open
        if (this.showInventory) {
          this.drawInventory();
        }

        // Draw interaction prompt
        const distance = Math.abs(this.player.x - this.npc.x) + Math.abs(this.player.y - this.npc.y);
        if (distance <= 2) {
          this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          this.ctx.fillRect(this.canvas.width/2 - 80, 350, 160, 30);
          this.ctx.strokeStyle = '#ffff00';
          this.ctx.lineWidth = 2;
          this.ctx.strokeRect(this.canvas.width/2 - 80, 350, 160, 30);
          
          this.ctx.fillStyle = '#ffff00';
          this.ctx.font = '14px monospace';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('Press E to talk', this.canvas.width/2, 370);
          this.ctx.textAlign = 'left';
        }
      }

      drawUI() {
        // Title
        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 16px monospace';
        this.ctx.fillText('SNES JRPG Framework - Complete Demo', 20, 25);
        
        // Player position
        this.ctx.font = '12px monospace';
        this.ctx.fillStyle = '#88ff88';
        this.ctx.fillText(`Player: (${this.player.x}, ${this.player.y})`, 20, 45);
        
        // Features list
        const features = [
          '• Grid-based Movement ✓',
          '• NPC Interactions ✓', 
          '• Inventory System ✓',
          '• SNES-style Graphics ✓'
        ];
        
        this.ctx.fillStyle = '#ffaa00';
        features.forEach((feature, i) => {
          this.ctx.fillText(feature, 20, 70 + i * 15);
        });
        
        // Frame counter
        this.ctx.fillStyle = '#888888';
        this.ctx.fillText(`Frame: ${this.frame}`, 20, this.canvas.height - 20);
      }

      drawInventory() {
        // Inventory background
        const invX = 250, invY = 150, invW = 300, invH = 200;
        
        this.ctx.fillStyle = 'rgba(0, 0, 30, 0.95)';
        this.ctx.fillRect(invX, invY, invW, invH);
        
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(invX, invY, invW, invH);
        
        // Inventory title
        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 16px monospace';
        this.ctx.fillText('INVENTORY', invX + 10, invY + 25);
        
        // Inventory items
        this.ctx.font = '12px monospace';
        this.inventory.forEach((item, i) => {
          const y = invY + 50 + i * 20;
          
          this.ctx.fillStyle = item.type === 'weapon' ? '#ff6644' : 
                              item.type === 'consumable' ? '#44ff66' : '#6644ff';
          this.ctx.fillText(`• ${item.name}`, invX + 20, y);
          
          this.ctx.fillStyle = '#ffffff';
          this.ctx.fillText(`x${item.quantity}`, invX + 200, y);
        });
        
        // Close instruction
        this.ctx.fillStyle = '#888888';
        this.ctx.font = '10px monospace';
        this.ctx.fillText('Press I to close', invX + 10, invY + invH - 10);
      }

      start() {
        this.running = true;
        this.gameLoop();
      }

      gameLoop() {
        if (!this.running) return;
        
        this.update();
        this.render();
        this.frame++;
        
        // Update debug info
        document.getElementById('debug-info').innerHTML = `
          FPS: ${Math.round(60)} | 
          Player: (${this.player.x}, ${this.player.y}) | 
          Inventory: ${this.showInventory ? 'Open' : 'Closed'}
        `;
        
        requestAnimationFrame(() => this.gameLoop());
      }
    }

    // Start the game when page loads
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🎯 Starting complete JRPG game...');
      
      try {
        const game = new SNESJRPGGame();
        window.__jrpgGame = game;
        
        console.log('✅ Complete JRPG game started successfully!');
        console.log('🎮 Use WASD to move, E to interact, I for inventory');
        
      } catch (error) {
        console.error('❌ Game failed to start:', error);
        document.getElementById('status').textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
